<body>
    <script>
        // Phuong trinh bac 1 : ax + b =0
        let a = parseFloat (prompt("Nhap vao hang so a (a ≠ 0)"));
        let b = parseFloat (prompt ("Nhap vao hang so b "));
        if (a === 0){
            alert ('a=0 phuong trinh vo nghiem .');
        } else{
            let x = - b/a;
            alert(`Nghiem cua phuong trinh la : x = ${x}`);

        }
        
        
        

    </script>
</body>
