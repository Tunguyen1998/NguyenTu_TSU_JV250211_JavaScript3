<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Nhập giá trị của a, b và c
  let a = parseFloat(prompt("Nhập giá trị a (a ≠ 0)"));
  let b = parseFloat(prompt("Nhập giá trị b"));
  let c = parseFloat(prompt("Nhập giá trị c"));
  let delta = b * b - 4 * a * c;  
        // Xử lý các trường hợp của delta
    if (delta > 0) {
        // Hai nghiệm phân biệt
        let x1 = (-b + Math.sqrt(delta)) / (2 * a);
        let x2 = (-b - Math.sqrt(delta)) / (2 * a);
        alert(`Phương trình có 2 nghiệm phân biệt: x1 = ${x1}, x2 = ${x2}`);
    } else if (delta === 0) {
        // Một nghiệm kép
        let x = -b / (2 * a);
        alert(`Phương trình có nghiệm kép: x = ${x}`);
    } else {
        // Không có nghiệm thực
        alert("Phương trình vô nghiệm trong tập số thực.");
    }

    </script>
</body>
</html>
