<!DOCTYPE html>
<html lang="en">

<body>
    <script>
        let input = prompt (' Nhap vao do dai 2 canh ke cua tam giac vuong (cach nhau bang dau cach)');
        let [a, b] = input.split(" ").map(Number); //Chuyen chuoi thanh so
        let c = a * b / 2;
        alert (` Dien tich tam giac vuong la: ${c}m2`);


    </script>
</body>
